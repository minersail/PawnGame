<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endless Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: the board fills the screen; a quiet HUD sits in the corners, touch buttons along the bottom. */
  :root {
    --bg: #0b0d14;        /* palette slot 0 */
    --ink: #e2cfae;       /* ivory ramp 4 */
    --ink-dim: #7a634f;   /* ivory ramp 2 */
    --slate: #2a3448;     /* dark square ramp */
    --slate-hi: #4d5d7c;  /* light square ramp */
    --font-display: 'Silkscreen', ui-monospace, monospace;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: var(--font-mono); font-size: 13px;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; outline: none;
  }
  #view:active { cursor: grabbing; }
  .hud {
    position: fixed; pointer-events: none; display: flex; flex-direction: column; gap: 4px;
  }
  .hud.top {
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: max(16px, env(safe-area-inset-left, 0px));
  }
  .hud.corner {
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: max(16px, env(safe-area-inset-right, 0px));
    text-align: right;
  }
  h1 { margin: 0; font: 400 18px/1 var(--font-display); letter-spacing: 0.06em; text-wrap: balance; }
  .label { color: var(--ink-dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  #coords, .stat { font: 400 16px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .keys { color: var(--ink-dim); font-size: 12px; line-height: 1.6; }
  kbd {
    font: 500 11px var(--font-mono); color: var(--ink);
    border: 1px solid var(--slate-hi); border-bottom-width: 2px; padding: 0 4px; border-radius: 3px;
  }
  #status[hidden], .flash[hidden], .banner[hidden] { display: none; }
  .flash {
    position: fixed; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none;
    font: 400 20px var(--font-display); letter-spacing: 0.1em; color: var(--ink); text-shadow: 0 2px 0 var(--bg);
  }
  .banner {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 14px;
    padding: 0 16px max(18vh, 140px); background: color-mix(in srgb, var(--bg) 45%, transparent); pointer-events: none;
  }
  .banner-title { font: 400 28px var(--font-display); letter-spacing: 0.1em; }
  .banner button {
    pointer-events: auto; min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--slate-hi);
    background: var(--slate); color: var(--ink); font: 400 14px var(--font-display); letter-spacing: 0.06em; cursor: pointer;
  }
  #status {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 0 16px;
    font: 400 14px var(--font-display); letter-spacing: 0.08em; color: var(--ink); text-align: center;
  }
  .controls {
    position: fixed; display: none; align-items: flex-end; justify-content: space-between; gap: 12px;
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .controls button {
    min-width: 76px; height: 60px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--slate-hi);
    background: color-mix(in srgb, var(--slate) 80%, transparent); color: var(--ink);
    font: 400 13px var(--font-display); letter-spacing: 0.04em; touch-action: none; cursor: pointer;
  }
  .controls .hop { min-width: 88px; height: 76px; font-size: 22px; }
  .controls .stack { display: flex; flex-direction: column; gap: 10px; }
  .controls .stack button:first-child { height: 48px; }
  .controls button:active { background: var(--slate-hi); }
  .controls button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (pointer: coarse) {
    .controls { display: flex; }
    .keys { display: none; }
  }
</style>
</head>
<body>

<canvas id="view" tabindex="0" aria-label="Pawn on an endless chessboard. W or up arrow hops forward; A and D swing the sword; Space dashes; Z and C block."></canvas>

<div class="hud top">
  <h1>Endless Board</h1>
  <div class="keys">
    <div><kbd>W</kbd> or <kbd>↑</kbd>: hop forward (hold to keep going)</div>
    <div><kbd>A</kbd> <kbd>D</kbd> or <kbd>←</kbd> <kbd>→</kbd>: swing left / right</div>
    <div><kbd>Space</kbd> or <kbd>Shift</kbd>: dash two squares</div>
    <div><kbd>Z</kbd> <kbd>C</kbd>: block left / right</div>
    <div><kbd>R</kbd>: restart after you're cut down</div>
    <div>Drag: orbit · double-click: reset · scroll: zoom</div>
  </div>
</div>
<div class="hud corner">
  <span class="label">Square</span>
  <span id="coords">0, 0</span>
  <span class="label">Taken</span>
  <span id="taken" class="stat">0</span>
  <span class="label">Health</span>
  <span id="hp" class="stat" aria-live="polite">■■■</span>
</div>

<div id="flash" class="flash" hidden></div>
<div id="banner" class="banner" hidden>
  <div class="banner-title">Cut down</div>
  <button type="button" id="restart">Restart <kbd>R</kbd></button>
</div>

<div id="status">Baking splats…</div>

<div class="controls">
  <div class="stack">
    <button type="button" id="block-left" data-move="block" data-side="1" aria-label="Block left">◀ Block</button>
    <button type="button" id="swing-left" data-move="swing" data-side="1" aria-label="Swing left">◀ Swing</button>
  </div>
  <div class="stack">
    <button type="button" id="dash" data-move="dash" aria-label="Dash two squares forward">Dash ⇈</button>
    <button type="button" id="pad-up" class="hop" aria-label="Hop forward">↑</button>
  </div>
  <div class="stack">
    <button type="button" id="block-right" data-move="block" data-side="-1" aria-label="Block right">Block ▶</button>
    <button type="button" id="swing-right" data-move="swing" data-side="-1" aria-label="Swing right">Swing ▶</button>
  </div>
</div>

<script src="ink/dist/ink-studio.bake.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
