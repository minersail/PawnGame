<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endless Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: the board fills the screen; a quiet HUD sits in the corners, pad bottom-left on touch. */
  :root {
    --bg: #0b0d14;        /* palette slot 0 */
    --ink: #e2cfae;       /* ivory ramp 4 */
    --ink-dim: #7a634f;   /* ivory ramp 2 */
    --slate: #2a3448;     /* dark square ramp */
    --slate-hi: #4d5d7c;  /* light square ramp */
    --font-display: 'Silkscreen', ui-monospace, monospace;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: var(--font-mono); font-size: 13px;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; outline: none;
  }
  #view:active { cursor: grabbing; }
  .hud {
    position: fixed; pointer-events: none; display: flex; flex-direction: column; gap: 4px;
  }
  .hud.top {
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: max(16px, env(safe-area-inset-left, 0px));
  }
  .hud.corner {
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: max(16px, env(safe-area-inset-right, 0px));
    text-align: right;
  }
  h1 { margin: 0; font: 400 18px/1 var(--font-display); letter-spacing: 0.06em; text-wrap: balance; }
  .label { color: var(--ink-dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  #coords { font: 400 16px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .keys { color: var(--ink-dim); font-size: 12px; line-height: 1.6; }
  kbd {
    font: 500 11px var(--font-mono); color: var(--ink);
    border: 1px solid var(--slate-hi); border-bottom-width: 2px; padding: 0 4px; border-radius: 3px;
  }
  #status[hidden] { display: none; }
  #status {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 0 16px;
    font: 400 14px var(--font-display); letter-spacing: 0.08em; color: var(--ink); text-align: center;
  }
  .pad {
    position: fixed; display: none;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px;
  }
  .turns {
    position: fixed; display: none; gap: 8px;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .pad button, .turns button {
    width: 52px; height: 52px; border-radius: 6px; border: 1px solid var(--slate-hi);
    background: color-mix(in srgb, var(--slate) 80%, transparent); color: var(--ink);
    font: 400 18px var(--font-display); touch-action: none; cursor: pointer;
  }
  .pad button:active, .turns button:active { background: var(--slate-hi); }
  .pad button:focus-visible, .turns button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .pad [data-dir="up"] { grid-area: 1 / 2; }
  .pad [data-dir="left"] { grid-area: 2 / 1; }
  .pad [data-dir="right"] { grid-area: 2 / 3; }
  .pad [data-dir="down"] { grid-area: 3 / 2; }
  @media (pointer: coarse) {
    .pad { display: grid; }
    .turns { display: flex; }
    .keys { display: none; }
  }
</style>
</head>
<body>

<canvas id="view" tabindex="0" aria-label="Pawn on an endless chessboard. Arrow keys or WASD hop one square."></canvas>

<div class="hud top">
  <h1>Endless Board</h1>
  <div class="keys">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows: hop</div>
    <div><kbd>Q</kbd><kbd>E</kbd>: turn camera · drag: orbit · scroll: zoom</div>
  </div>
</div>
<div class="hud corner">
  <span class="label">Square</span>
  <span id="coords">0, 0</span>
</div>

<div id="status">Baking splats…</div>

<div class="pad" aria-label="Hop">
  <button type="button" id="pad-up" data-dir="up" aria-label="Hop forward">↑</button>
  <button type="button" id="pad-left" data-dir="left" aria-label="Hop left">←</button>
  <button type="button" id="pad-right" data-dir="right" aria-label="Hop right">→</button>
  <button type="button" id="pad-down" data-dir="down" aria-label="Hop back">↓</button>
</div>
<div class="turns">
  <button type="button" id="turn-left" data-turn="-1" aria-label="Turn camera left">⟲</button>
  <button type="button" id="turn-right" data-turn="1" aria-label="Turn camera right">⟳</button>
</div>

<script src="ink/dist/ink-studio.bake.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
